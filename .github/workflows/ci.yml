name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    # Offline unit tests (fake LLM + classifier): fast, free, on every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev,ui]"
      - run: pytest -q

  evals:
    # Real-model evals on the golden set: on main and on demand (uses the free Gemini quota).
    needs: tests
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/medtriage/classifier.py') }}
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev,hf,eval,ui]"
      - run: pytest evals -m eval -s
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/
