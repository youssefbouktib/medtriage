name: evals

# Real-model evals on the golden set. They use the free Gemini quota (about 20 requests
# per model per day), so they run only when the agent or the evals change, never twice at once.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "evals/**"
      - "pyproject.toml"
  workflow_dispatch:

concurrency:
  group: evals
  cancel-in-progress: true

jobs:
  evals:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/medtriage/classifier.py') }}
      - run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -e ".[dev,hf,eval]"
      - run: pytest -q
      - run: pytest evals -m eval -s
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/
